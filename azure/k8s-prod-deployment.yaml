apiVersion: apps/v1
kind: Deployment
metadata:
  name: pdex-app-prod
  labels:
    app: pdex
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pdex
  template:
    metadata:
      labels:
        app: pdex
    spec:
      containers:
      - name: pdex
        image: acrpdexdev.azurecr.io/pdex:latest-prod
        ports:
        - containerPort: 8080
        envFrom:
        - secretRef:
            name: pdex-secrets-prod

---
apiVersion: v1
kind: Service
metadata:
  name: pdex-service-prod
spec:
  selector:
    app: pdex
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pdex-ingress-prod
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
  - host: www.pdex.gov.bc.ca
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: pdex-service-prod
            port:
              number: 80
